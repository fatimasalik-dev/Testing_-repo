<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | EduBridge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <main class="booking-page">

        <a href="../index.html" class="skill-back">
            ← Back to Home
        </a>

        <div class="booking-card">

            <h1>Log In</h1>
            <p class="booking-with">Welcome back to EduBridge</p>

            <form id="login-form">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Your password">
                </div>

                <button type="submit" class="btn btn-accent">
                    Log In
                </button>

            </form>

            <p id="login-error" style="margin-top:16px; font-size:14px; color:#c0392b; text-align:center; display:none;">
                Incorrect email or password.
            </p>

            <p style="margin-top:20px; font-size:14px; color:#52716C; text-align:center;">
                Don't have an account? <a href="signup.html" style="color:#073F3D; font-weight:600;">Create one</a>
            </p>

        </div>

    </main>


    <footer class="site-footer">
        <p>©️ 2026 EduBridge — student project prototype.</p>
    </footer>


    <script>
        // PROTOTYPE ONLY: checks against the single account saved in this
        // browser's local storage during signup. A real version would
        // check credentials against a secure server-side database.
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const saved = JSON.parse(localStorage.getItem('edubridge_account') || 'null');

            if (saved && saved.email === email && saved.password === password) {
                localStorage.setItem('edubridge_loggedIn', 'true');
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        });
    </script>

</body>
</html>
